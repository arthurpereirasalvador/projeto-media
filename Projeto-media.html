YPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Escolar Profissional</title>

<style>
:root{
    --primaria:#2563eb;
        --sucesso:#16a34a;
            --alerta:#ea580c;
                --erro:#dc2626;
                    --fundo:#f3f4f6;
                    }
                    
                    *{
                        margin:0;
                            padding:0;
                                box-sizing:border-box;
                                    font-family:Segoe UI, Arial, sans-serif;
                                    }
                                    
                                    body{
                                        background:var(--fundo);
                                            padding:30px;
                                            }
                                            
                                            .container{
                                                max-width:1200px;
                                                    margin:auto;
                                                    }
                                                    
                                                    h1{
                                                        text-align:center;
                                                            margin-bottom:25px;
                                                                color:#1f2937;
                                                                }
                                                                
                                                                .card{
                                                                    background:white;
                                                                        border-radius:12px;
                                                                            padding:20px;
                                                                                box-shadow:0 2px 10px rgba(0,0,0,.1);
                                                                                    margin-bottom:20px;
                                                                                    }
                                                                                    
                                                                                    .form-grid{
                                                                                        display:grid;
                                                                                            grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
                                                                                                gap:12px;
                                                                                                }
                                                                                                
                                                                                                input{
                                                                                                    width:100%;
                                                                                                        padding:12px;
                                                                                                            border:1px solid #d1d5db;
                                                                                                                border-radius:8px;
                                                                                                                }
                                                                                                                
                                                                                                                .btn{
                                                                                                                    border:none;
                                                                                                                        padding:12px;
                                                                                                                            border-radius:8px;
                                                                                                                                cursor:pointer;
                                                                                                                                    color:white;
                                                                                                                                        font-weight:bold;
                                                                                                                                        }
                                                                                                                                        
                                                                                                                                        .btn-salvar{background:var(--primaria);width:100%;margin-top:15px;}
                                                                                                                                        .btn-limpar{background:var(--erro);width:100%;margin-top:10px;}
                                                                                                                                        .btn-excluir{background:var(--erro);padding:8px 12px;}
                                                                                                                                        
                                                                                                                                        .estatisticas{
                                                                                                                                            display:grid;
                                                                                                                                                grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
                                                                                                                                                    gap:15px;
                                                                                                                                                    }
                                                                                                                                                    
                                                                                                                                                    .estatistica{
                                                                                                                                                        background:white;
                                                                                                                                                            padding:20px;
                                                                                                                                                                text-align:center;
                                                                                                                                                                    border-radius:12px;
                                                                                                                                                                        box-shadow:0 2px 10px rgba(0,0,0,.1);
                                                                                                                                                                        }
                                                                                                                                                                        
                                                                                                                                                                        table{
                                                                                                                                                                            width:100%;
                                                                                                                                                                                border-collapse:collapse;
                                                                                                                                                                                    background:white;
                                                                                                                                                                                    }
                                                                                                                                                                                    
                                                                                                                                                                                    th,td{
                                                                                                                                                                                        padding:12px;
                                                                                                                                                                                            border:1px solid #e5e7eb;
                                                                                                                                                                                                text-align:center;
                                                                                                                                                                                                }
                                                                                                                                                                                                
                                                                                                                                                                                                th{
                                                                                                                                                                                                    background:#1f2937;
                                                                                                                                                                                                        color:white;
                                                                                                                                                                                                        }
                                                                                                                                                                                                        
                                                                                                                                                                                                        .aprovado{color:var(--sucesso);font-weight:bold;}
                                                                                                                                                                                                        .recuperacao{color:var(--alerta);font-weight:bold;}
                                                                                                                                                                                                        .reprovado{color:var(--erro);font-weight:bold;}
                                                                                                                                                                                                        </style>
                                                                                                                                                                                                        </head>
                                                                                                                                                                                                        
                                                                                                                                                                                                        <body>
                                                                                                                                                                                                        
                                                                                                                                                                                                        <div class="container">
                                                                                                                                                                                                        
                                                                                                                                                                                                        <h1>Sistema de Controle de Médias Escolares</h1>
                                                                                                                                                                                                        
                                                                                                                                                                                                        <div class="card">
                                                                                                                                                                                                            <div class="form-grid">
                                                                                                                                                                                                                    <input type="text" id="nome" placeholder="Nome do aluno">
                                                                                                                                                                                                                            <input type="number" id="n1" placeholder="Nota 1" min="0" max="10">
                                                                                                                                                                                                                                    <input type="number" id="n2" placeholder="Nota 2" min="0" max="10">
                                                                                                                                                                                                                                            <input type="number" id="n3" placeholder="Nota 3" min="0" max="10">
                                                                                                                                                                                                                                                    <input type="number" id="n4" placeholder="Nota 4" min="0" max="10">
                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                            <button class="btn btn-salvar" onclick="adicionarAluno()">
                                                                                                                                                                                                                                                                    Cadastrar Aluno
                                                                                                                                                                                                                                                                        </button>
                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                            <button class="btn btn-limpar" onclick="limparTudo()">
                                                                                                                                                                                                                                                                                    Limpar Todos os Dados
                                                                                                                                                                                                                                                                                        </button>
                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                        <div class="card">
                                                                                                                                                                                                                                                                                            <input
                                                                                                                                                                                                                                                                                                    type="text"
                                                                                                                                                                                                                                                                                                            id="pesquisa"
                                                                                                                                                                                                                                                                                                                    placeholder="Pesquisar aluno..."
                                                                                                                                                                                                                                                                                                                            onkeyup="renderizarTabela()"
                                                                                                                                                                                                                                                                                                                                >
                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                <div class="estatisticas">
                                                                                                                                                                                                                                                                                                                                    <div class="estatistica"><h3>Aprovados</h3><h2 id="aprovados">0</h2></div>
                                                                                                                                                                                                                                                                                                                                        <div class="estatistica"><h3>Recuperação</h3><h2 id="recuperacao">0</h2></div>
                                                                                                                                                                                                                                                                                                                                            <div class="estatistica"><h3>Reprovados</h3><h2 id="reprovados">0</h2></div>
                                                                                                                                                                                                                                                                                                                                                <div class="estatistica"><h3>Média da Turma</h3><h2 id="mediaTurma">0</h2></div>
                                                                                                                                                                                                                                                                                                                                                    <div class="estatistica"><h3>Maior Média</h3><h2 id="maiorMedia">0</h2></div>
                                                                                                                                                                                                                                                                                                                                                        <div class="estatistica"><h3>Menor Média</h3><h2 id="menorMedia">0</h2></div>
                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                        <div class="card">
                                                                                                                                                                                                                                                                                                                                                        <table>
                                                                                                                                                                                                                                                                                                                                                        <thead>
                                                                                                                                                                                                                                                                                                                                                        <tr>
                                                                                                                                                                                                                                                                                                                                                        <th>Aluno</th>
                                                                                                                                                                                                                                                                                                                                                        <th>N1</th>
                                                                                                                                                                                                                                                                                                                                                        <th>N2</th>
                                                                                                                                                                                                                                                                                                                                                        <th>N3</th>
                                                                                                                                                                                                                                                                                                                                                        <th>N4</th>
                                                                                                                                                                                                                                                                                                                                                        <th>Média</th>
                                                                                                                                                                                                                                                                                                                                                        <th>Situação</th>
                                                                                                                                                                                                                                                                                                                                                        <th>Ação</th>
                                                                                                                                                                                                                                                                                                                                                        </tr>
                                                                                                                                                                                                                                                                                                                                                        </thead>
                                                                                                                                                                                                                                                                                                                                                        <tbody id="tabelaAlunos"></tbody>
                                                                                                                                                                                                                                                                                                                                                        </table>
                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                        <script>
                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                        let alunos = JSON.parse(localStorage.getItem("alunos")) || [];
                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                        function salvarDados(){
                                                                                                                                                                                                                                                                                                                                                            localStorage.setItem("alunos", JSON.stringify(alunos));
                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                            function calcularSituacao(media){
                                                                                                                                                                                                                                                                                                                                                                if(media >= 6) return "Aprovado";
                                                                                                                                                                                                                                                                                                                                                                    if(media >= 4) return "Recuperação";
                                                                                                                                                                                                                                                                                                                                                                        return "Reprovado";
                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                        function adicionarAluno(){
                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                            const nome = document.getElementById("nome").value.trim();
                                                                                                                                                                                                                                                                                                                                                                                const n1 = Number(document.getElementById("n1").value);
                                                                                                                                                                                                                                                                                                                                                                                    const n2 = Number(document.getElementById("n2").value);
                                                                                                                                                                                                                                                                                                                                                                                        const n3 = Number(document.getElementById("n3").value);
                                                                                                                                                                                                                                                                                                                                                                                            const n4 = Number(document.getElementById("n4").value);
                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                if(!nome || isNaN(n1) || isNaN(n2) || isNaN(n3) || isNaN(n4)){
                                                                                                                                                                                                                                                                                                                                                                                                        alert("Preencha todos os campos.");
                                                                                                                                                                                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                        const media = (n1+n2+n3+n4)/4;
                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                            alunos.push({
                                                                                                                                                                                                                                                                                                                                                                                                                                    nome,
                                                                                                                                                                                                                                                                                                                                                                                                                                            n1,
                                                                                                                                                                                                                                                                                                                                                                                                                                                    n2,
                                                                                                                                                                                                                                                                                                                                                                                                                                                            n3,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    n4,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            media,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    situacao: calcularSituacao(media)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            salvarDados();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                limparFormulario();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    renderizarTabela();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function limparFormulario(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("nome").value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById("n1").value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("n2").value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("n3").value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("n4").value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function excluirAluno(indice){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            alunos.splice(indice,1);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                salvarDados();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    renderizarTabela();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function limparTudo(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if(confirm("Deseja realmente apagar todos os dados?")){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                alunos = [];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        salvarDados();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                renderizarTabela();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function renderizarTabela(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const tabela = document.getElementById("tabelaAlunos");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const filtro = document.getElementById("pesquisa").value.toLowerCase();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                tabela.innerHTML = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let aprovados = 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let recuperacao = 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let reprovados = 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let soma = 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    alunos.forEach((aluno,index)=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            soma += aluno.media;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if(aluno.situacao === "Aprovado") aprovados++;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            else if(aluno.situacao === "Recuperação") recuperacao++;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    else reprovados++;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if(!aluno.nome.toLowerCase().includes(filtro)){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const classe =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    aluno.situacao === "Aprovado" ? "aprovado" :
